<style>
/* Layout: one phone column; summary first, then categories as tappable cards, edits in a bottom sheet */
:root{
  --bg:#fbf7ef; --card:#fffdf8; --ink:#2a211c; --soft:#6f645a; --line:#e6dccb;
  --maroon:#7a1f2b; --maroon-2:#5c1520; --gold:#a8843f; --gold-deep:#7d5f25; --gold-soft:#efe4cc;
  --ok:#2f6b3a; --ok-bg:#e3efdf; --warn:#8a5a10; --warn-bg:#fbf0d6; --bad:#8f1d2c; --bad-bg:#f6dfdf;
  --on-maroon:#fff8ec; --shadow:0 10px 28px rgba(92,21,32,.10);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1412; --card:#241b18; --ink:#f3e9dc; --soft:#b6a796; --line:#3a2e28;
  --maroon:#b0414f; --maroon-2:#7a1f2b; --gold:#d1ad66; --gold-deep:#e0bf7c; --gold-soft:#3a2f22;
  --ok:#8fd19a; --ok-bg:#1f3324; --warn:#f0c46a; --warn-bg:#3a2e14; --bad:#f19aa4; --bad-bg:#3d1c21;
  --on-maroon:#fff8ec; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1412; --card:#241b18; --ink:#f3e9dc; --soft:#b6a796; --line:#3a2e28;
  --maroon:#b0414f; --maroon-2:#7a1f2b; --gold:#d1ad66; --gold-deep:#e0bf7c; --gold-soft:#3a2f22;
  --ok:#8fd19a; --ok-bg:#1f3324; --warn:#f0c46a; --warn-bg:#3a2e14; --bad:#f19aa4; --bad-bg:#3d1c21;
  --on-maroon:#fff8ec; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:38px;flex:0 0 auto}
.brand b{display:block;font:600 21px/1 var(--display);letter-spacing:.22em}
.brand small{display:block;font-size:9px;letter-spacing:.5em;color:var(--gold-deep);margin-top:3px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

.example{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:12px}
.example button{border:0;background:var(--warn);color:var(--bg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:12px;white-space:nowrap}

/* summary */
.sum{background:linear-gradient(155deg,var(--maroon),var(--maroon-2));color:var(--on-maroon);border-radius:26px;padding:20px 18px 16px;box-shadow:var(--shadow)}
.sum h1{margin:0;font:600 28px/1.05 var(--display);text-wrap:balance}
.sum .names{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.sumrow{display:grid;grid-template-columns:108px minmax(0,1fr);gap:16px;align-items:center;margin-top:14px}
.ring{position:relative;width:108px;height:108px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{display:block;font:600 26px/1 var(--display)}
.ring .c small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.budgetbtn{display:block;width:100%;text-align:left;border:1px solid rgba(255,248,236,.28);background:rgba(255,248,236,.08);border-radius:14px;padding:9px 12px;color:inherit}
.budgetbtn small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.budgetbtn b{font:600 24px/1.1 var(--display)}
.budgetbtn em{display:block;font-style:normal;font-size:10.5px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:rgba(255,248,236,.1);border-radius:12px;padding:8px 10px}
.stat small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.78}
.stat b{font-size:14px;font-weight:600;white-space:nowrap}
.left{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;background:var(--on-maroon);color:var(--ink)}
.left small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.left b{font:600 22px/1 var(--display)}
.left.over b{color:var(--bad)} .left.ok b{color:var(--ok)}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:18px 0 12px;padding:5px;border-radius:999px;background:var(--gold-soft)}
.tabs button{border:0;background:transparent;border-radius:999px;padding:9px;font-weight:600;font-size:13.5px;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--maroon);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--maroon);color:var(--on-maroon);font-size:10.5px;margin-left:4px;padding:0 5px}

/* categories */
.cats{display:grid;gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cathead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left}
.cico{width:44px;height:44px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;color:var(--maroon)}
.cico svg{width:22px;height:22px}
.cname{font-weight:600;font-size:15px}
.cmeta{font-size:12px;color:var(--soft)}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.camt{text-align:right}
.camt b{display:block;font-weight:600;font-size:15px}
.camt small{font-size:11px;color:var(--soft)}
.items{border-top:1px solid var(--line);padding:4px 10px 10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;width:100%;padding:11px 6px;border:0;border-bottom:1px dashed var(--line);background:transparent;text-align:left}
.item:last-of-type{border-bottom:0}
.iname{font-size:14px;font-weight:500;min-width:0}
.iamt{text-align:right;font-weight:600;font-size:14px}
.isub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--soft)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.p-not{background:var(--line);color:var(--soft)} .p-book{background:var(--gold-soft);color:var(--gold-deep)}
.p-adv{background:var(--warn-bg);color:var(--warn)} .p-full{background:var(--ok-bg);color:var(--ok)}
.p-due{background:var(--bad-bg);color:var(--bad)}
.addbtn svg{width:16px;height:16px}
.addbtn{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;margin-top:6px;padding:10px;border-radius:12px;border:1px dashed var(--gold);background:transparent;color:var(--gold-deep);font-weight:600;font-size:13px}

/* due list */
.due{display:grid;gap:10px}
.dueitem{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.dueitem.soon{border-color:var(--bad);background:var(--bad-bg)}
.date{text-align:center;border-radius:12px;background:var(--gold-soft);padding:6px 0}
.date b{display:block;font:600 22px/1 var(--display);color:var(--maroon)}
.date small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.empty{text-align:center;padding:30px 16px;color:var(--soft);background:var(--card);border-radius:18px;border:1px dashed var(--line)}

.foot{text-align:center;margin-top:26px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-deep)}
.foot span{display:block;letter-spacing:.04em;text-transform:none;font-size:12px;color:var(--soft);margin-top:4px}

/* floating action */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;padding:14px 22px;border-radius:999px;border:0;background:var(--maroon);color:var(--on-maroon);font-weight:600;box-shadow:0 12px 30px rgba(92,21,32,.35);z-index:20}
.fab svg{width:18px;height:18px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,8,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 12px;font:600 26px/1.1 var(--display)}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;min-width:0}
label.f input,label.f select{width:100%;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:400}
.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.statusgrid button{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;color:var(--soft)}
.statusgrid button[aria-pressed="true"]{border-color:var(--maroon);color:var(--maroon);background:var(--card);box-shadow:inset 0 0 0 1px var(--maroon)}
.calc{display:flex;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font-size:13px}
.actions{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:4px}
.btn{padding:14px;border-radius:14px;border:0;font-weight:600}
.btn.main{background:var(--maroon);color:var(--on-maroon)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.confirm{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--bad-bg);color:var(--bad);font-size:13.5px}
.confirm div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu{display:grid;gap:8px}
.menu a,.menu button.m{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink);font-weight:600;text-align:left;width:100%}
.menu svg{width:22px;height:22px;color:var(--maroon);flex:0 0 auto}
.menu small{display:block;font-weight:400;color:var(--soft);font-size:12px}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;transition:transform .25s}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand" aria-label="Muzayyan">
      <svg viewBox="0 0 32 40" aria-hidden="true"><path d="M3 39V15C3 8 9 4 16 1c7 3 13 7 13 14v24" fill="none" stroke="var(--gold)" stroke-width="2.2"/><text x="16" y="29" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="16" fill="var(--maroon)">M</text></svg>

<script>
(function(){
const KEY="bulawa-budget-v1";
const CATS=[
 {k:"venue",n:"Venue & catering",i:'<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>'},
 {k:"outfits",n:"Outfits",i:'<path d="M8 3l4 3 4-3 4 4-3 3v11H7V10L4 7z"/>'},
 {k:"jewel",n:"Jewellery",i:'<path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18M9 4l3 16 3-16"/>'},
 {k:"beauty",n:"Beauty & mehndi",i:'<path d="M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/>'},
 {k:"photo",n:"Photo & video",i:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l2-3h4l2 3"/><circle cx="12" cy="13.5" r="3.5"/>'},
 {k:"decor",n:"Decor & flowers",i:'<circle cx="12" cy="9" r="3"/><path d="M12 12v9M12 6a3 3 0 1 1 3-3M12 6a3 3 0 1 0-3-3M9 9a3 3 0 1 1-3-3M15 9a3 3 0 1 0 3-3"/>'},
 {k:"music",n:"Music & dhol",i:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'},
 {k:"invite",n:"Invitations & gifts",i:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"/>'},
 {k:"travel",n:"Transport & honeymoon",i:'<path d="M3 13l7-2 4-7 2 1-2 7 5 2-1 2-6-1-3 5h-2l1-6-5 1z"/>'},
 {k:"other",n:"Other",i:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'}];
const FUNCS=["Dholki","Mehndi","Nikah","Baraat","Walima","All"];
const STATUS=[["not","Not booked"],["book","Booked"],["adv","Advance paid"],["full","Fully paid"]];
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=n=>{const d=today();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function sample(){let id=1;const it=(c,n,f,p,q,paid,st,v,ph,due)=>({id:id++,c,n,f,p,q,paid,st,v:v||"",ph:ph||"",due:due||""});
 return {example:true,budget:5000000,couple:"",items:[
  it("venue","Baraat hall","Baraat",700000,750000,250000,"adv","Grand Marquee","0300 1234567",addDays(5)),

  it("outfits","Bridal dress","Baraat",350000,380000,190000,"adv","","",addDays(20)),
  it("outfits","Groom's sherwani","Baraat",120000,110000,110000,"full"),
  it("outfits","Walima outfits","Walima",150000,0,0,"not"),
  it("jewel","Bridal jewellery set","Baraat",250000,0,0,"not"),
  it("beauty","Bridal makeup, Baraat and Walima","All",120000,130000,40000,"adv","","",addDays(3)),
  it("beauty","Mehndi artist","Mehndi",15000,0,0,"not"),
  it("photo","Photographer and highlight film","All",180000,175000,50000,"adv"),
  it("decor","Stage and flowers","All",200000,0,0,"not"),
  it("music","Dhol and DJ","Mehndi",40000,0,0,"not"),
  it("invite","Digital invitation","All",4500,4500,4500,"full","Muzayyan"),
  it("invite","Sweet boxes for guests","All",60000,0,0,"not"),
  it("travel","Bridal car","Baraat",25000,0,0,"not"),
  it("other","Emergency buffer","All",150000,0,0,"not")]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){S=null}
if(!S||!Array.isArray(S.items))S=sample();
let open=new Set(["venue"]),tab="cats";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}};
const $=id=>document.getElementById(id);
const rs=n=>"Rs "+Math.round(n||0).toLocaleString("en-US");
const exp=x=>(+x.q>0?+x.q:+x.p||0);
const bal=x=>Math.max(exp(x)-(+x.paid||0),0);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const daysTo=d=>d?Math.round((new Date(d+"T00:00:00")-today())/864e5):null;
const pill=x=>{const st=x.st||"not";const m={not:["p-not","Not booked"],book:["p-book","Booked"],adv:["p-adv","Advance paid"],full:["p-full","Fully paid"]}[st];return `<span class="pill ${m[0]}">${m[1]}</span>`};

function render(){
  const E=S.items.reduce((a,x)=>a+exp(x),0),P=S.items.reduce((a,x)=>a+(+x.paid||0),0),B=+S.budget||0;
  $("budgetVal").textContent=rs(B);$("sExp").textContent=rs(E);$("sPaid").textContent=rs(P);
  const L=B-E;$("sLeft").textContent=(L<0?"− ":"")+rs(Math.abs(L));$("leftLabel").textContent=L<0?"Over budget by":"Left in budget";
  $("leftBox").className="left "+(L<0?"over":"ok");
  const C=2*Math.PI*50,u=B?Math.min(E/B,1):0,pp=B?Math.min(P/B,1):0;
  $("ringUsed").setAttribute("stroke-dasharray",`${u*C} ${C}`);$("ringPaid").setAttribute("stroke-dasharray",`${pp*C} ${C}`);
  $("usedPct").textContent=(B?Math.round(E/B*100):0)+"%";
  $("exampleBar").hidden=!S.example;$("coupleLine").textContent=S.couple?S.couple+" · wedding budget":"Wedding budget";
  // categories
  $("catsView").innerHTML=CATS.map(c=>{const its=S.items.filter(x=>x.c===c.k);if(!its.length&&c.k==="other"&&!open.has("other"))return catHtml(c,its);const ce=its.reduce((a,x)=>a+exp(x),0),cp=its.reduce((a,x)=>a+(+x.paid||0),0);return catHtml(c,its,ce,cp)}).join("");
  // due
  const due=S.items.filter(x=>bal(x)>0&&x.st!=="not").sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const soon=due.filter(x=>{const d=daysTo(x.due);return d!==null&&d<=7}).length;
  $("dueCount").hidden=!soon;$("dueCount").textContent=soon;
  $("dueView").innerHTML=due.length?due.map(x=>{const d=daysTo(x.due),dt=x.due?new Date(x.due+"T00:00:00"):null;
    const when=d===null?"No date set":d<0?`${-d} days overdue`:d===0?"Due today":`In ${d} day${d>1?"s":""}`;
    return `<button type="button" class="dueitem${d!==null&&d<=7?" soon":""}" data-edit="${x.id}"><div class="date">${dt?`<b>${dt.getDate()}</b><small>${dt.toLocaleString("en",{month:"short"})}</small>`:"<b>–</b><small>date</small>"}</div>
      <div style="min-width:0"><div class="iname">${esc(x.n)}</div><div class="cmeta">${esc(x.v||catName(x.c))} · ${when}</div></div><div class="iamt num">${rs(bal(x))}</div></button>`}).join("")
    :`<div class="empty">Nothing to pay right now. Booked vendors with money still owed show up here, nearest date first.</div>`;
  $("catsView").hidden=tab!=="cats";$("dueView").hidden=tab!=="due";
  $("tabCats").setAttribute("aria-selected",tab==="cats");$("tabDue").setAttribute("aria-selected",tab==="due");
}
const catName=k=>(CATS.find(c=>c.k===k)||CATS[CATS.length-1]).n;
function catHtml(c,its,ce=0,cp=0){const isOpen=open.has(c.k);
  return `<div class="cat"><button type="button" class="cathead" data-cat="${c.k}" aria-expanded="${isOpen}"><span class="cico">${svg(c.i)}</span>
   <span style="min-width:0"><span class="cname">${c.n}</span><span class="cmeta" style="display:block">${its.length?`${its.length} item${its.length>1?"s":""} · ${rs(cp)} paid`:"Nothing added yet"}</span><span class="bar"><i style="width:${ce?Math.min(cp/ce*100,100):0}%"></i></span></span>
   <span class="camt"><b class="num">${rs(ce)}</b><small>${isOpen?"Hide":"Show"}</small></span></button>
   ${isOpen?`<div class="items">${its.map(x=>`<button type="button" class="item" data-edit="${x.id}"><span class="iname">${esc(x.n)}</span><span class="iamt num">${rs(exp(x))}</span>
     <span class="isub">${pill(x)}${x.f?`<span>${esc(x.f)}</span>`:""}${bal(x)>0&&x.st!=="not"?`<span>· ${rs(bal(x))} still to pay</span>`:""}</span></button>`).join("")}
     <button type="button" class="addbtn" data-add="${c.k}">${svg('<path d="M12 5v14M5 12h14"/>')}Add to ${c.n}</button></div>`:""}</div>`}

// sheet
let lastFocus=null;
function openSheet(html,focusSel){lastFocus=document.activeElement;$("sheetBody").innerHTML=html;$("scrim").hidden=false;$("sheet").hidden=false;
  requestAnimationFrame(()=>{$("scrim").classList.add("on");$("sheet").classList.add("on");const f=focusSel&&$("sheetBody").querySelector(focusSel);if(f)f.focus()})}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");setTimeout(()=>{$("scrim").hidden=true;$("sheet").hidden=true;$("sheetBody").innerHTML="";if(lastFocus)lastFocus.focus()},260)}
$("scrim").onclick=closeSheet;addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1800)}
const numIn=(id,label,val)=>`<label class="f" for="${id}">${label}<input id="${id}" inputmode="numeric" pattern="[0-9,]*" value="${val?Math.round(val).toLocaleString("en-US"):""}" placeholder="0"></label>`;
const readNum=id=>+(($(id).value||"").replace(/[^\d]/g,""))||0;

function editItem(id,cat){const isNew=id==null;const x=isNew?{id:Date.now(),c:cat||"venue",n:"",f:"All",p:0,q:0,paid:0,st:"not",v:"",ph:"",due:""}:S.items.find(i=>i.id===id);if(!x)return;
  openSheet(`<h2 id="sheetTitle">${isNew?"Add an expense":"Edit expense"}</h2><div class="form">
   <label class="f" for="eName">What is it<input id="eName" value="${esc(x.n)}" placeholder="For example: Walima catering"></label>
   <div class="two"><label class="f" for="eCat">Category<select id="eCat">${CATS.map(c=>`<option value="${c.k}"${c.k===x.c?" selected":""}>${c.n}</option>`).join("")}</select></label>
   <label class="f" for="eFunc">Function<select id="eFunc">${FUNCS.map(f=>`<option${f===x.f?" selected":""}>${f}</option>`).join("")}</select></label></div>
   <div class="two">${numIn("eP","Planned (Rs)",x.p)}${numIn("eQ","Final quote (Rs)",x.q)}</div>
   <div class="two">${numIn("ePaid","Paid so far (Rs)",x.paid)}<label class="f" for="eDue">Next payment date<input id="eDue" type="date" value="${x.due||""}"></label></div>
   <div class="calc"><span>Still to pay</span><b class="num" id="eBal">${rs(bal(x))}</b></div>
   <div><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:6px">Status</div>
   <div class="statusgrid" id="eSt">${STATUS.map(([k,l])=>`<button type="button" data-st="${k}" aria-pressed="${x.st===k}">${l}</button>`).join("")}</div></div>
   <div class="two"><label class="f" for="eV">Vendor<input id="eV" value="${esc(x.v)}" placeholder="Name"></label><label class="f" for="ePh">Vendor phone<input id="ePh" inputmode="tel" value="${esc(x.ph)}" placeholder="03xx xxxxxxx"></label></div>
   <div id="delZone"></div>
   <div class="actions">${isNew?`<button type="button" class="btn ghost" id="eCancel">Cancel</button>`:`<button type="button" class="btn danger" id="eDel">Delete</button>`}<button type="button" class="btn main" id="eSave">${isNew?"Add expense":"Save changes"}</button></div></div>`, isNew?"#eName":null);
  let st=x.st;
  const upd=()=>{const e=readNum("eQ")||readNum("eP");$("eBal").textContent=rs(Math.max(e-readNum("ePaid"),0))};
  ["eP","eQ","ePaid"].forEach(i=>$(i).addEventListener("input",e=>{const v=e.target.value.replace(/[^\d]/g,"");e.target.value=v?(+v).toLocaleString("en-US"):"";upd()}));
  $("eSt").onclick=e=>{const b=e.target.closest("[data-st]");if(!b)return;st=b.dataset.st;$("eSt").querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",z===b))};
  if($("eCancel"))$("eCancel").onclick=closeSheet;
  if($("eDel"))$("eDel").onclick=()=>{$("delZone").innerHTML=`<div class="confirm">Delete "${esc(x.n)}"? This cannot be undone.<div><button type="button" class="btn ghost" id="dNo">Keep it</button><button type="button" class="btn danger" id="dYes">Delete</button></div></div>`;
    $("dNo").onclick=()=>{$("delZone").innerHTML=""};$("dYes").onclick=()=>{S.items=S.items.filter(i=>i.id!==x.id);S.example=false;save();render();closeSheet();toast("Expense deleted")}};
  $("eSave").onclick=()=>{const n=$("eName").value.trim();if(!n){$("eName").focus();$("eName").style.borderColor="var(--bad)";return}
    Object.assign(x,{n,c:$("eCat").value,f:$("eFunc").value,p:readNum("eP"),q:readNum("eQ"),paid:readNum("ePaid"),due:$("eDue").value,st,v:$("eV").value.trim(),ph:$("ePh").value.trim()});
    if(x.paid>0&&st==="not")x.st="adv";if(x.paid>0&&x.paid>=exp(x))x.st="full";
    if(isNew)S.items.push(x);S.example=false;open.add(x.c);save();render();closeSheet();toast(isNew?"Expense added":"Saved")};
}
function editBudget(){openSheet(`<h2 id="sheetTitle">Your total budget</h2><div class="form">${numIn("bAmt","Total budget (Rs)",S.budget)}
  <label class="f" for="bCouple">Your names (optional)<input id="bCouple" value="${esc(S.couple||"")}" placeholder="Ayesha & Hamza"></label>
  <div class="actions"><button type="button" class="btn ghost" id="bCancel">Cancel</button><button type="button" class="btn main" id="bSave">Save</button></div></div>`,"#bAmt");
  $("bAmt").addEventListener("input",e=>{const v=e.target.value.replace(/[^\d]/g,"");e.target.value=v?(+v).toLocaleString("en-US"):""});
  $("bCancel").onclick=closeSheet;$("bSave").onclick=()=>{S.budget=readNum("bAmt");S.couple=$("bCouple").value.trim();S.example=false;save();render();closeSheet();toast("Budget saved")}}
function summaryText(){const E=S.items.reduce((a,x)=>a+exp(x),0),P=S.items.reduce((a,x)=>a+(+x.paid||0),0);
  const lines=CATS.map(c=>{const t=S.items.filter(x=>x.c===c.k).reduce((a,x)=>a+exp(x),0);return t?`• ${c.n}: ${rs(t)}`:""}).filter(Boolean);
  return `*${S.couple?S.couple+" · ":""}Wedding budget*\nTotal budget: ${rs(S.budget)}\nExpected cost: ${rs(E)}\nPaid so far: ${rs(P)}\nStill to pay: ${rs(E-P)}\n${S.budget-E<0?"Over budget by":"Left in budget"}: ${rs(Math.abs(S.budget-E))}\n\n${lines.join("\n")}\n\nMade with Muzayyan · muzayyan.com`}
function menu(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  openSheet(`<h2 id="sheetTitle">Share and backup</h2><div class="menu">
   <a href="https://wa.me/?text=${encodeURIComponent(summaryText())}" target="_blank" rel="noopener">${svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>')}<span>Share summary on WhatsApp<small>Send the totals to family or your partner</small></span></a>
   <button type="button" class="m" id="mCopy">${svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/>')}<span>Copy backup code<small>Save it in your notes to restore your budget on any phone</small></span></button>
   <button type="button" class="m" id="mRestore">${svg('<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8M4 4v4h4"/>')}<span>Restore from backup<small>Paste a backup code you saved earlier</small></span></button>
   <div id="restoreZone"></div>
   <button type="button" class="m" id="mFresh">${svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>')}<span>Start fresh<small>Clear everything and add your own expenses</small></span></button>
   <div id="freshZone"></div></div>`);
  $("mCopy").onclick=async()=>{try{await navigator.clipboard.writeText(code);toast("Backup code copied")}catch(_){$("restoreZone").innerHTML=`<textarea id="codeBox" readonly>${code}</textarea>`;$("codeBox").select();toast("Select and copy the code")}};
  $("mRestore").onclick=()=>{$("restoreZone").innerHTML=`<textarea id="rBox" placeholder="Paste your backup code here"></textarea><button type="button" class="btn main" id="rGo" style="width:100%;margin-top:8px">Restore budget</button>`;
    $("rGo").onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($("rBox").value.trim()))));if(!Array.isArray(d.items))throw 0;S=d;save();render();closeSheet();toast("Budget restored")}catch(_){toast("That code did not work. Copy it again and paste it whole.")}}};
  $("mFresh").onclick=()=>{$("freshZone").innerHTML=`<div class="confirm">Clear the whole budget and start empty?<div><button type="button" class="btn ghost" id="fNo">Keep it</button><button type="button" class="btn danger" id="fYes">Clear all</button></div></div>`;$("fNo").onclick=()=>{$("freshZone").innerHTML=""};$("fYes").onclick=fresh}}
function fresh(){S={example:false,budget:0,couple:"",items:[]};open=new Set(["venue"]);save();render();if(!$("sheet").hidden)closeSheet();setTimeout(editBudget,300);toast("Fresh budget ready")}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cat]");if(c){const k=c.dataset.cat;open.has(k)?open.delete(k):open.add(k);render();return}
  const ed=e.target.closest("[data-edit]");if(ed){editItem(+ed.dataset.edit);return}
  const ad=e.target.closest("[data-add]");if(ad){editItem(null,ad.dataset.add)}});
$("fab").onclick=()=>editItem(null,[...open][0]||"venue");
$("budgetBtn").onclick=editBudget;$("menuBtn").onclick=menu;
$("freshBtn").onclick=()=>{const z=$("exampleBar");z.innerHTML=`<span>Clear the example and start empty?</span><button type="button" id="fy">Yes, clear</button>`;$("fy").onclick=()=>{z.innerHTML='<span>This is an example budget. Edit it, or start fresh with your own.</span><button type="button" id="freshBtn">Start fresh</button>';fresh()}};
$("tabCats").onclick=()=>{tab="cats";render()};$("tabDue").onclick=()=>{tab="due";render()};
render();
})();
</script>

</html>
