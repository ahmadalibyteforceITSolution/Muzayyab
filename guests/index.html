<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column; headcounts first, then a searchable guest list, edits in a bottom sheet */
:root{
  --bg:#fbf7ef; --card:#fffdf8; --ink:#2a211c; --soft:#6f645a; --line:#e6dccb;
  --maroon:#7a1f2b; --maroon-2:#5c1520; --gold:#a8843f; --gold-deep:#7d5f25; --gold-soft:#efe4cc;
  --ok:#2f6b3a; --ok-bg:#e3efdf; --warn:#8a5a10; --warn-bg:#fbf0d6; --bad:#8f1d2c; --bad-bg:#f6dfdf;
  --on-maroon:#fff8ec; --shadow:0 10px 28px rgba(92,21,32,.10);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1412; --card:#241b18; --ink:#f3e9dc; --soft:#b6a796; --line:#3a2e28;
  --maroon:#b0414f; --maroon-2:#7a1f2b; --gold:#d1ad66; --gold-deep:#e0bf7c; --gold-soft:#3a2f22;
  --ok:#8fd19a; --ok-bg:#1f3324; --warn:#f0c46a; --warn-bg:#3a2e14; --bad:#f19aa4; --bad-bg:#3d1c21;
  --on-maroon:#fff8ec; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1412; --card:#241b18; --ink:#f3e9dc; --soft:#b6a796; --line:#3a2e28;
  --maroon:#b0414f; --maroon-2:#7a1f2b; --gold:#d1ad66; --gold-deep:#e0bf7c; --gold-soft:#3a2f22;
  --ok:#8fd19a; --ok-bg:#1f3324; --warn:#f0c46a; --warn-bg:#3a2e14; --bad:#f19aa4; --bad-bg:#3d1c21;
  --on-maroon:#fff8ec; --shadow:0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:38px;flex:0 0 auto}
.brand b{display:block;font:600 21px/1 var(--display);letter-spacing:.22em}
.brand small{display:block;font-size:9px;letter-spacing:.5em;color:var(--gold-deep);margin-top:3px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

.example{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:12px}
.example button{border:0;background:var(--warn);color:var(--bg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:12px;white-space:nowrap}

/* summary */
.sum{background:linear-gradient(155deg,var(--maroon),var(--maroon-2));color:var(--on-maroon);border-radius:26px;padding:20px 18px 16px;box-shadow:var(--shadow)}
.sum h1{margin:0;font:600 28px/1.05 var(--display);text-wrap:balance}
.sum .names{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.sumrow{display:grid;grid-template-columns:108px minmax(0,1fr);gap:16px;align-items:center;margin-top:14px}
.ring{position:relative;width:108px;height:108px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{display:block;font:600 26px/1 var(--display)}
.ring .c small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.budgetbtn{display:block;width:100%;text-align:left;border:1px solid rgba(255,248,236,.28);background:rgba(255,248,236,.08);border-radius:14px;padding:9px 12px;color:inherit}
.budgetbtn small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.budgetbtn b{font:600 24px/1.1 var(--display)}
.budgetbtn em{display:block;font-style:normal;font-size:10.5px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:rgba(255,248,236,.1);border-radius:12px;padding:8px 10px}
.stat small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.78}
.stat b{font-size:14px;font-weight:600;white-space:nowrap}
.left{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;background:var(--on-maroon);color:var(--ink)}
.left small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.left b{font:600 22px/1 var(--display)}
.left.over b{color:var(--bad)} .left.ok b{color:var(--ok)}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:18px 0 12px;padding:5px;border-radius:999px;background:var(--gold-soft)}
.tabs button{border:0;background:transparent;border-radius:999px;padding:9px;font-weight:600;font-size:13.5px;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--maroon);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--maroon);color:var(--on-maroon);font-size:10.5px;margin-left:4px;padding:0 5px}

/* categories */
.cats{display:grid;gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cathead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left}
.cico{width:44px;height:44px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;color:var(--maroon)}
.cico svg{width:22px;height:22px}
.cname{font-weight:600;font-size:15px}
.cmeta{font-size:12px;color:var(--soft)}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.camt{text-align:right}
.camt b{display:block;font-weight:600;font-size:15px}
.camt small{font-size:11px;color:var(--soft)}
.items{border-top:1px solid var(--line);padding:4px 10px 10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;width:100%;padding:11px 6px;border:0;border-bottom:1px dashed var(--line);background:transparent;text-align:left}
.item:last-of-type{border-bottom:0}
.iname{font-size:14px;font-weight:500;min-width:0}
.iamt{text-align:right;font-weight:600;font-size:14px}
.isub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--soft)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.p-not{background:var(--line);color:var(--soft)} .p-book{background:var(--gold-soft);color:var(--gold-deep)}
.p-adv{background:var(--warn-bg);color:var(--warn)} .p-full{background:var(--ok-bg);color:var(--ok)}
.p-due{background:var(--bad-bg);color:var(--bad)}
.addbtn svg{width:16px;height:16px}
.addbtn{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;margin-top:6px;padding:10px;border-radius:12px;border:1px dashed var(--gold);background:transparent;color:var(--gold-deep);font-weight:600;font-size:13px}

/* due list */
.due{display:grid;gap:10px}
.dueitem{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.dueitem.soon{border-color:var(--bad);background:var(--bad-bg)}
.date{text-align:center;border-radius:12px;background:var(--gold-soft);padding:6px 0}
.date b{display:block;font:600 22px/1 var(--display);color:var(--maroon)}
.date small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.empty{text-align:center;padding:30px 16px;color:var(--soft);background:var(--card);border-radius:18px;border:1px dashed var(--line)}

.foot{text-align:center;margin-top:26px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-deep)}
.foot span{display:block;letter-spacing:.04em;text-transform:none;font-size:12px;color:var(--soft);margin-top:4px}

/* floating action */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;padding:14px 22px;border-radius:999px;border:0;background:var(--maroon);color:var(--on-maroon);font-weight:600;box-shadow:0 12px 30px rgba(92,21,32,.35);z-index:20}
.fab svg{width:18px;height:18px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,8,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 12px;font:600 26px/1.1 var(--display)}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;min-width:0}
label.f input,label.f select{width:100%;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:400}
.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.statusgrid button{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;color:var(--soft)}
.statusgrid button[aria-pressed="true"]{border-color:var(--maroon);color:var(--maroon);background:var(--card);box-shadow:inset 0 0 0 1px var(--maroon)}
.calc{display:flex;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--gold-soft);font-size:13px}
.actions{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:4px}
.btn{padding:14px;border-radius:14px;border:0;font-weight:600}
.btn.main{background:var(--maroon);color:var(--on-maroon)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.confirm{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--bad-bg);color:var(--bad);font-size:13.5px}
.confirm div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu{display:grid;gap:8px}
.menu a,.menu button.m{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink);font-weight:600;text-align:left;width:100%}
.menu svg{width:22px;height:22px;color:var(--maroon);flex:0 0 auto}
.menu small{display:block;font-weight:400;color:var(--soft);font-size:12px}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;transition:transform .25s}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* guest list additions */
.fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.fxc{background:rgba(255,248,236,.1);border-radius:14px;padding:10px 8px;text-align:center}
.fxc svg{width:20px;height:20px;color:#e3c47e}
.fxc b{display:block;font:600 26px/1 var(--display);margin-top:4px}
.fxc small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-top:3px}
.reply{margin-top:12px;background:var(--on-maroon);color:var(--ink);border-radius:14px;padding:12px}
.rbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.rbar i{display:block;height:100%}
.r-yes{background:var(--ok)}.r-maybe{background:var(--gold)}.r-no{background:var(--bad)}
.rleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--soft)}
.rleg span{display:inline-flex;align-items:center;gap:5px}.rleg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.rleg b{color:var(--ink)}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;font-size:12px;color:var(--soft)}
.toprow b{font:600 20px/1 var(--display);color:var(--ink)}
.search{display:flex;gap:8px;align-items:center;margin:16px 0 10px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.search svg{width:18px;height:18px;color:var(--soft);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;font-size:16px;color:var(--ink);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--on-maroon)}
.chip em{font-style:normal;opacity:.75;margin-left:4px;font-weight:500}
.glist{display:grid;gap:8px}
.g{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:600 18px/1 var(--display);background:var(--gold-soft);color:var(--maroon)}
.av.groom{background:var(--maroon);color:var(--on-maroon)}
.gmain{min-width:0;border:0;background:transparent;text-align:left;padding:0}
.gname{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--soft)}
.fn{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold-deep);font-size:10.5px;font-weight:600}
.gact{display:grid;gap:6px;justify-items:end}
.send{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;background:#1f8f4e;color:#fff;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.send svg{width:14px;height:14px}
.sent{font-size:11px;color:var(--ok);font-weight:600;white-space:nowrap}
.rp{border:0;font:inherit}
.p-yes{background:var(--ok-bg);color:var(--ok)}.p-maybe{background:var(--warn-bg);color:var(--warn)}.p-no{background:var(--bad-bg);color:var(--bad)}.p-none{background:var(--line);color:var(--soft)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button,.tog button{padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;color:var(--soft)}
.seg button[aria-pressed="true"],.tog button[aria-pressed="true"]{border-color:var(--maroon);color:var(--maroon);background:var(--card);box-shadow:inset 0 0 0 1px var(--maroon)}
.tog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);font-weight:600;margin-bottom:6px}
.step{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.step button{height:48px;border:0;background:transparent;font-size:22px;color:var(--maroon)}
.step output{text-align:center;font:600 22px/1 var(--display)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);width:100%;font-weight:600;font-size:14px}
.switch i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] i{background:var(--ok)}.switch[aria-checked="true"] i::after{transform:translateX(18px)}
textarea.msg{min-height:110px;font:14px/1.45 var(--body)}
</style>
<div class="wrap">
  <header class="top">
    <div class="brand" aria-label="Muzayyan">
      <svg viewBox="0 0 32 40" aria-hidden="true"><path d="M3 39V15C3 8 9 4 16 1c7 3 13 7 13 14v24" fill="none" stroke="var(--gold)" stroke-width="2.2"/><text x="16" y="29" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="16" fill="var(--maroon)">M</text></svg>
      <div><b>MUZAYYAN</b><small>STUDIO</small></div>
    </div>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Settings, share and backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <div class="example" id="exampleBar"><span>These are example guests. Edit them, or start fresh with your own.</span><button type="button" id="freshBtn">Start fresh</button></div>

  <section class="sum" aria-label="Guest summary">
    <div class="names" id="coupleLine">Guest list</div>
    <h1>Everyone you are inviting, in one place</h1>
    <div class="fx" id="fx"></div>
    <div class="reply">
      <div class="toprow"><span><b class="num" id="tPeople">0</b> people · <span class="num" id="tHomes">0</span> families</span><span id="tSent">0 of 0 invited</span></div>
      <div class="rbar" id="rbar"></div>
      <div class="rleg" id="rleg"></div>
    </div>
  </section>

  <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search a name, city or phone" autocomplete="off"></label>

  <p class="foot">Muzayyan<span>muzayyan.com · cinematic digital wedding invitations</span></p>
</div>

<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add guest</button>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><div class="grab"></div><div id="sheetBody"></div></div>

<script>
(function(){
const KEY="bulawa-guests-v1";
const FN=[["m","Mehndi",'<path d="M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/>'],["b","Baraat / Nikah",'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>'],["w","Walima",'<circle cx="12" cy="13" r="6"/><path d="M3 13h2M19 13h2M12 4v3"/>']];
const REL=["Family","Friend","Colleague","Neighbour","Other"];
const RP={yes:["p-yes","Coming"],maybe:["p-maybe","Maybe"],no:["p-no","Not coming"],none:["p-none","No reply"]};
function sample(){let id=1;const g=(n,side,rel,ph,city,ppl,fn,sent,r)=>({id:id++,n,side,rel,ph,city,ppl,fn,sent,r});
 return {example:true,couple:"Ayesha & Hamza",link:"muzayyan.com/ayesha-hamza",msg:"",guests:[
  g("Khan family (Tariq uncle)","bride","Family","0300 1234567","Karachi",5,["m","b","w"],true,"yes"),
  g("Sheikh family (Nani)","bride","Family","0321 2223344","Lahore",3,["m","b","w"],true,"yes"),
  g("Sara and Bilal","bride","Friend","0333 4455667","Karachi",2,["m","b"],true,"maybe"),
  g("Office team, Hamza","groom","Colleague","","Karachi",8,["w"],false,"none"),
  g("Qureshi family (Chacha)","groom","Family","0345 9988776","Islamabad",6,["b","w"],true,"yes"),
  g("Farah aunty","groom","Neighbour","0300 7654321","Karachi",2,["b","w"],true,"no"),
  g("Ali, Usman and friends","groom","Friend","0312 1112223","Karachi",4,["m","b","w"],false,"none"),
  g("Malik family","bride","Family","0301 5556667","Hyderabad",4,["b","w"],true,"none")]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){S=null}
if(!S||!Array.isArray(S.guests))S=sample();
let filt="all",q="";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const WA='<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>';
const sum=(arr,f)=>arr.reduce((a,x)=>a+(f(x)?(+x.ppl||0):0),0);
const intl=ph=>{let d=(ph||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("0"))d="92"+d.slice(1);return d};
function inviteText(x){const who=S.couple||"our wedding";const fns=FN.filter(f=>x.fn.includes(f[0])).map(f=>f[1]).join(", ");
  return (S.msg&&S.msg.trim()?S.msg.replace(/\{name\}/g,x.n):`Dear ${x.n}, 🤍\nYou are warmly invited to the wedding of ${who}.\n${fns?"Functions: "+fns+"\n":""}Open your invitation here: ${S.link||"muzayyan.com"}\n\nPlease let us know if you can come.`)}
const filters=[["all","All"],["bride","Bride's side"],["groom","Groom's side"],["notsent","Not invited yet"],["none","No reply"],["yes","Coming"],["m","Mehndi"],["b","Baraat / Nikah"],["w","Walima"]];
const match=(x,k)=>k==="all"||(k==="bride"||k==="groom"?x.side===k:k==="notsent"?!x.sent:k==="none"||k==="yes"?x.r===k:x.fn.includes(k));

function render(){
  const G=S.guests;
  $("exampleBar").hidden=!S.example;$("coupleLine").textContent=S.couple?S.couple+" · guest list":"Guest list";
  $("fx").innerHTML=FN.map(f=>`<div class="fxc">${svg(f[2])}<b class="num">${sum(G,x=>x.fn.includes(f[0]))}</b><small>${f[1]}</small></div>`).join("");
  const tot=sum(G,()=>true);$("tPeople").textContent=tot;$("tHomes").textContent=G.length;
  $("tSent").textContent=`${G.filter(x=>x.sent).length} of ${G.length} invited`;
  const parts=[["yes","r-yes"],["maybe","r-maybe"],["no","r-no"]];
  $("rbar").innerHTML=parts.map(([k,c])=>{const v=sum(G,x=>x.r===k);return v?`<i class="${c}" style="width:${v/tot*100}%"></i>`:""}).join("");
  $("rleg").innerHTML=[["yes","var(--ok)","Coming"],["maybe","var(--gold)","Maybe"],["no","var(--bad)","Not coming"],["none","var(--line)","No reply"]].map(([k,c,l])=>`<span><i style="background:${c}"></i>${l} <b class="num">${sum(G,x=>x.r===k)}</b></span>`).join("");
  $("chips").innerHTML=filters.map(([k,l])=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${filt===k}">${l}<em>${G.filter(x=>match(x,k)).length}</em></button>`).join("");
  const ql=q.toLowerCase();
  const list=G.filter(x=>match(x,filt)&&(!ql||(x.n+" "+x.city+" "+x.ph).toLowerCase().includes(ql)));
  $("list").innerHTML=list.length?list.map(x=>{const r=RP[x.r]||RP.none,ph=intl(x.ph);
    return `<div class="g"><div class="av ${x.side==="groom"?"groom":""}" aria-hidden="true">${esc((x.n||"?").trim()[0].toUpperCase())}</div>
     <button type="button" class="gmain" data-edit="${x.id}"><div class="gname">${esc(x.n)}</div>
      <div class="gsub"><span class="num">${x.ppl} ${x.ppl==1?"person":"people"}</span>·<span>${x.side==="groom"?"Groom's side":"Bride's side"}</span>${FN.filter(f=>x.fn.includes(f[0])).map(f=>`<span class="fn">${f[1].split(" ")[0]}</span>`).join("")}</div></button>
     <div class="gact"><button type="button" class="pill rp ${r[0]}" data-cycle="${x.id}" aria-label="Reply: ${r[1]}. Tap to change">${r[1]}</button>
      ${x.sent?`<span class="sent">✓ Invited</span>`:`<a class="send" href="https://wa.me/${ph}?text=${encodeURIComponent(inviteText(x))}" target="_blank" rel="noopener" data-send="${x.id}">${svg(WA)}Invite</a>`}</div></div>`}).join("")
   :`<div class="empty">${G.length?"No guests match this filter.":"No guests yet. Tap Add guest to add the first family."}</div>`;
}
let lastFocus=null;
function openSheet(html,focusSel){lastFocus=document.activeElement;$("sheetBody").innerHTML=html;$("scrim").hidden=false;$("sheet").hidden=false;
  requestAnimationFrame(()=>{$("scrim").classList.add("on");$("sheet").classList.add("on");const f=focusSel&&$("sheetBody").querySelector(focusSel);if(f)f.focus()})}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");setTimeout(()=>{$("scrim").hidden=true;$("sheet").hidden=true;$("sheetBody").innerHTML="";if(lastFocus&&lastFocus.focus)lastFocus.focus()},260)}
$("scrim").onclick=closeSheet;addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1800)}
const segBtns=(name,opts,val)=>opts.map(([k,l])=>`<button type="button" data-${name}="${k}" aria-pressed="${k===val}">${l}</button>`).join("");

function edit(id){const isNew=id==null;const x=isNew?{id:Date.now(),n:"",side:"bride",rel:"Family",ph:"",city:"",ppl:2,fn:["b","w"],sent:false,r:"none"}:S.guests.find(g=>g.id===id);if(!x)return;
  const st={...x,fn:[...x.fn]};
  openSheet(`<h2 id="sheetTitle">${isNew?"Add a guest":"Edit guest"}</h2><div class="form">
   <label class="f" for="gN">Guest or family name<input id="gN" value="${esc(x.n)}" placeholder="For example: Khan family"></label>
   <div><div class="lbl">Side</div><div class="seg" id="gSide">${segBtns("side",[["bride","Bride's side"],["groom","Groom's side"]],x.side)}</div></div>
   <div><div class="lbl">How many people</div><div class="step"><button type="button" id="pMinus" aria-label="One less">−</button><output id="pOut" class="num">${x.ppl}</output><button type="button" id="pPlus" aria-label="One more">+</button></div></div>
   <div><div class="lbl">Invited to</div><div class="tog" id="gFn">${FN.map(f=>`<button type="button" data-fn="${f[0]}" aria-pressed="${x.fn.includes(f[0])}">${f[1]}</button>`).join("")}</div></div>
   <div class="two"><label class="f" for="gPh">WhatsApp number<input id="gPh" inputmode="tel" value="${esc(x.ph)}" placeholder="03xx xxxxxxx"></label>
   <label class="f" for="gC">City<input id="gC" value="${esc(x.city)}" placeholder="Karachi"></label></div>
   <label class="f" for="gR">Relation<select id="gR">${REL.map(r=>`<option${r===x.rel?" selected":""}>${r}</option>`).join("")}</select></label>
   <div><div class="lbl">Reply</div><div class="seg" id="gRp">${segBtns("rp",[["yes","Coming"],["maybe","Maybe"],["no","Not coming"],["none","No reply"]],x.r)}</div></div>
   <button type="button" class="switch" id="gSent" role="switch" aria-checked="${!!x.sent}">Invitation sent<i></i></button>
   <div id="delZone"></div>
   <div class="actions">${isNew?`<button type="button" class="btn ghost" id="eCancel">Cancel</button>`:`<button type="button" class="btn danger" id="eDel">Delete</button>`}<button type="button" class="btn main" id="eSave">${isNew?"Add guest":"Save changes"}</button></div></div>`,isNew?"#gN":null);
  const pick=(box,attr,key)=>$(box).onclick=e=>{const b=e.target.closest(`[data-${attr}]`);if(!b)return;st[key]=b.dataset[attr];$(box).querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",z===b))};
  pick("gSide","side","side");pick("gRp","rp","r");
  $("gFn").onclick=e=>{const b=e.target.closest("[data-fn]");if(!b)return;const k=b.dataset.fn,i=st.fn.indexOf(k);i>-1?st.fn.splice(i,1):st.fn.push(k);b.setAttribute("aria-pressed",i<0)};
  $("pMinus").onclick=()=>{st.ppl=Math.max(1,st.ppl-1);$("pOut").textContent=st.ppl};$("pPlus").onclick=()=>{st.ppl=Math.min(60,st.ppl+1);$("pOut").textContent=st.ppl};
  $("gSent").onclick=()=>{st.sent=!st.sent;$("gSent").setAttribute("aria-checked",st.sent)};
  if($("eCancel"))$("eCancel").onclick=closeSheet;
  if($("eDel"))$("eDel").onclick=()=>{$("delZone").innerHTML=`<div class="confirm">Remove "${esc(x.n)}" from the list?<div><button type="button" class="btn ghost" id="dNo">Keep</button><button type="button" class="btn danger" id="dYes">Remove</button></div></div>`;
    $("dNo").onclick=()=>{$("delZone").innerHTML=""};$("dYes").onclick=()=>{S.guests=S.guests.filter(g=>g.id!==x.id);S.example=false;save();render();closeSheet();toast("Guest removed")}};
  $("eSave").onclick=()=>{const n=$("gN").value.trim();if(!n){$("gN").focus();$("gN").style.borderColor="var(--bad)";return}
    Object.assign(x,st,{n,ph:$("gPh").value.trim(),city:$("gC").value.trim(),rel:$("gR").value});
    if(isNew)S.guests.unshift(x);S.example=false;save();render();closeSheet();toast(isNew?"Guest added":"Saved")};
}
function headcountText(){const G=S.guests;const yes=k=>sum(G,x=>x.fn.includes(k)&&x.r==="yes"),all=k=>sum(G,x=>x.fn.includes(k)&&x.r!=="no");
  return `*${S.couple?S.couple+" · ":""}Guest headcount*\n\n`+FN.map(f=>`${f[1]}: ${all(f[0])} invited, ${yes(f[0])} confirmed`).join("\n")+`\n\nTotal: ${sum(G,()=>true)} people from ${G.length} families\n\nMade with Muzayyan · muzayyan.com`}
function menu(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  openSheet(`<h2 id="sheetTitle">Settings and sharing</h2><div class="form">
   <label class="f" for="sC">Your names<input id="sC" value="${esc(S.couple)}" placeholder="Ayesha & Hamza"></label>
   <label class="f" for="sL">Your invitation link<input id="sL" value="${esc(S.link)}" placeholder="muzayyan.com/your-names"></label>
   <label class="f" for="sM">Invite message (optional)<textarea id="sM" class="msg" placeholder="Leave empty to use our ready message. Write {name} where the guest's name should go.">${esc(S.msg)}</textarea></label>
   <button type="button" class="btn main" id="sSave">Save settings</button></div>
   <div class="menu" style="margin-top:16px">
   <a href="https://wa.me/?text=${encodeURIComponent(headcountText())}" target="_blank" rel="noopener">${svg(WA)}<span>Send headcount on WhatsApp<small>Numbers for each function, for your caterer or family</small></span></a>
   <button type="button" class="m" id="mCopy">${svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/>')}<span>Copy backup code<small>Keep it in your notes to restore your list on any phone</small></span></button>
   <button type="button" class="m" id="mRestore">${svg('<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8M4 4v4h4"/>')}<span>Restore from backup<small>Paste a backup code you saved earlier</small></span></button>
   <div id="restoreZone"></div>
   <button type="button" class="m" id="mFresh">${svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>')}<span>Start fresh<small>Clear every guest and begin your own list</small></span></button>
   <div id="freshZone"></div></div>`);
  $("sSave").onclick=()=>{S.couple=$("sC").value.trim();S.link=$("sL").value.trim();S.msg=$("sM").value;save();render();closeSheet();toast("Settings saved")};
  $("mCopy").onclick=async()=>{try{await navigator.clipboard.writeText(code);toast("Backup code copied")}catch(_){$("restoreZone").innerHTML=`<textarea id="codeBox" readonly>${code}</textarea>`;$("codeBox").select();toast("Select and copy the code")}};
  $("mRestore").onclick=()=>{$("restoreZone").innerHTML=`<textarea id="rBox" placeholder="Paste your backup code here"></textarea><button type="button" class="btn main" id="rGo" style="width:100%;margin-top:8px">Restore list</button>`;
    $("rGo").onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($("rBox").value.trim()))));if(!Array.isArray(d.guests))throw 0;S=d;save();render();closeSheet();toast("List restored")}catch(_){toast("That code did not work. Copy it again and paste it whole.")}}};
  $("mFresh").onclick=()=>{$("freshZone").innerHTML=`<div class="confirm">Clear every guest and start empty?<div><button type="button" class="btn ghost" id="fNo">Keep</button><button type="button" class="btn danger" id="fYes">Clear all</button></div></div>`;$("fNo").onclick=()=>{$("freshZone").innerHTML=""};$("fYes").onclick=fresh}}
function fresh(){S={example:false,couple:"",link:"",msg:"",guests:[]};filt="all";save();render();if(!$("sheet").hidden)closeSheet();setTimeout(menu,300);toast("Fresh list ready. Add your names first.")}

document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");if(f){filt=f.dataset.f;render();return}
  const c=e.target.closest("[data-cycle]");if(c){const x=S.guests.find(g=>g.id===+c.dataset.cycle);const order=["none","yes","maybe","no"];x.r=order[(order.indexOf(x.r)+1)%4];S.example=false;save();render();toast("Reply: "+RP[x.r][1]);return}
  const s=e.target.closest("[data-send]");if(s){const x=S.guests.find(g=>g.id===+s.dataset.send);if(x){setTimeout(()=>{x.sent=true;save();render()},400);toast("Opening WhatsApp. Marked as invited.")}return}
  const ed=e.target.closest("[data-edit]");if(ed){edit(+ed.dataset.edit)}});
$("q").addEventListener("input",e=>{q=e.target.value.trim();render()});
$("fab").onclick=()=>edit(null);$("menuBtn").onclick=menu;
$("freshBtn").onclick=()=>{const z=$("exampleBar");z.innerHTML=`<span>Clear the example guests and start empty?</span><button type="button" id="fy">Yes, clear</button>`;$("fy").onclick=fresh};
render();
})();
</script>

</html>
